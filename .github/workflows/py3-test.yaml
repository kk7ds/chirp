name: Tests
on:
  pull_request:
jobs:
  style:
    name: Style checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: style

  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: unit
          tox_args: -k "not network"
      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: unit_report
          path: unit_report.html

  driver:
    name: Driver tests (Python 3.10)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: fast-driver

  driver-next:
    name: Driver tests (Python 3.14)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: fast-driver

  matrix:
    name: Create support matrix
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tox
        uses: ./.github/actions/py3-tox
        with:
          tox_target: makesupported
      - name: Archive support matrix
        uses: actions/upload-artifact@v4
        with:
          name: support-matrix
          path: model_support.html
