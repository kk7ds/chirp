name: Python3 tox runner
description: Runs tox py3 targets
inputs:
  tox_target:
    required: true
    type: string
  py_version:
    required: false
    type: string
    default: '3'
  tox_args:
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install python3-pip python3-wxgtk4.0 tox
        if tox --version | grep ^3; then
            sudo apt-get purge tox
            sudo pip install tox==4.4.8
        fi
    - name: Run tox
      shell: bash
      run: |
        git fetch origin $GITHUB_BASE_REF || true
        tox -e ${{ inputs.tox_target }} -- ${{ inputs.tox_args }}
